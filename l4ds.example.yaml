# l4ds-aio configuration: pass it with -config. Every key is optional; unknown keys are an error.

# The store the cabinets report: shown on the network screen, in room lists and in rankings.
store:
  name: L4DS Emulator
  prefecture: Tokyo # must not be empty

# The host string the game compares with its table to choose the matching master and lobby.
server_key: dev.game.zet.square-enix.co.jp

# The national versus schedule. The mode select offers versus while a unit is open, from start
# until end. Difficulty is easy, normal, advanced or expert. Cost is the SVP to enter; 0 uses the
# cabinet's own versus setting. game_mode is a mode from update\scripts\gamemodes.txt: arcade
# versus is Versus Survival, mutation15 (survival-based, with player-controlled infected), whose
# rounds the arcade server scores and ends itself. Plain versus runs the stock campaign versus.
versus:
  - id: 1
    stage: 1 # Dead Center
    chapter: 1
    difficulty: normal
    cost: 0
    take_weapon: false
    game_mode: mutation15
    start: 2026-01-01T00:00:00+09:00
    end: 2031-01-01T00:00:00+09:00

# Events. type is national, store, national_ex or store_ex; a store event is offered only when its
# id equals the cabinet's store event id (test menu). An event is open during its period (open to
# close; always, when left out) and its daily hours (daily_open to daily_close as HH:MM in the
# server's time zone; all day, when left out). god shows a fifth "GOD" difficulty badge.
# multi_match events gather players before starting, which the server does not support yet.
# detail is shown on the announcement; "|" starts a new line. The level and class bounds are the
# entry conditions shown there.
events:
  - id: 1
    type: national
    stage: 1
    chapter: 1
    difficulty: normal
    take_weapon: true
    take_disposable: true
    game_mode: mutation2 # headshots only
    name: サンプル全国イベント
    detail: l4ds-aio の試験用イベントです。|ヘッドショットのみ有効。
  - id: 1
    type: store
    stage: 1
    chapter: 1
    difficulty: normal
    take_weapon: true
    take_disposable: true
    game_mode: mutation2
    name: サンプル店内イベント
    detail: l4ds-aio の試験用イベントです。
